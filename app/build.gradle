plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}


android {
    namespace "com.festival.flyer.postermaker"
    compileSdk 36

    defaultConfig {
        applicationId "com.festival.flyer.postermaker"
        minSdkVersion 23
        targetSdk 36
        versionCode 29
        versionName "3.8"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.facebook.android:audience-network-sdk:6.18.0'
    implementation 'com.google.ads.mediation:facebook:6.18.0.0'

    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-auth'

    implementation 'com.firebaseui:firebase-ui-database:8.0.2'

    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'

    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'

    //Animation
    implementation 'com.airbnb.android:lottie:6.6.2'

    implementation 'com.android.volley:volley:1.2.1'

    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    //Glide Dependencies
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.github.woxthebox:draglistview:1.7.3'
    implementation 'com.github.florent37:viewanimator:1.0.4'

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"

    //OneSignal
    implementation 'com.onesignal:OneSignal:[5.6.1, 5.9.99]'

    //Gson
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-base:18.5.0'

    //ImageView
    implementation 'com.makeramen:roundedimageview:2.3.0'

    implementation 'com.github.yalantis:ucrop:2.2.10'
    implementation("com.google.android.ump:user-messaging-platform:3.1.0")
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

}